services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: firewatch
      POSTGRES_PASSWORD: firewatch
      POSTGRES_DB: firewatch
    ports:
      - "5432:5432"
    volumes:
      - firewatch_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firewatch -d firewatch"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  firewatch_pg:
